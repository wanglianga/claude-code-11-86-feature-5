<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 公交灰度实验服务</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="login-logo">🚌</div>
    <h1>公交网络灰度实验服务</h1>
    <p class="muted">随机分配 · 暴露路径 · 共同支持 · ITT 估计 · 扩围护栏</p>

    <label>账号
      <input name="username" autocomplete="username" required placeholder="analyst" />
    </label>
    <label>密码
      <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
    </label>

    <button class="btn primary block" type="submit">登录</button>

    <div class="login-accounts">
      <div class="small muted">测试账号（密码同账号 + 123）：</div>
      <table class="mini-table">
        <tr><td><code>viewer / viewer123</code></td><td>只读审阅</td></tr>
        <tr><td><code>analyst / analyst123</code></td><td>分析师：重算/评估</td></tr>
        <tr><td><code>approver / approver123</code></td><td>审批人：扩围决策</td></tr>
      </table>
    </div>
    <div id="login-msg" class="badge red" style="display:none">用户名或密码错误</div>
  </form>
  <script>
    if (location.search.includes('error')) {
      document.getElementById('login-msg').style.display = 'inline-block';
    }
  </script>
</body>
</html>
